title = "Student Management Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Ignore test fixtures, build output, and local-dev placeholder credentials"
paths = [
  '''target/''',
  '''src/test/''',
  # main application.properties uses env-var placeholders – no real secret
  '''src/main/resources/application\.properties''',
]

[[rules]]
id = "hardcoded-api-key"
description = "Hardcoded API key in Java source"
regex = '''(?i)(apiKey|api_key)\s*=\s*["'][^"']{10,}["']'''
tags = ["secret", "api-key"]
