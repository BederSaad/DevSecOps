name: DevSecOps Pipeline

on:
  push:
    branches: [ main, develop, demo/* ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # STAGE 1 - SECRETS SCAN (Gitleaks)
  # Blocks if any secret/API key/password found in code
  # ============================================================
  secrets_scan:
    name: "Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # ============================================================
  # STAGE 2 - BUILD AND TEST (Maven + Java 17)
  # Blocks if compilation fails or tests fail
  # ============================================================
  build_test:
    name: "Build and Test (Maven)"
    runs-on: ubuntu-latest
    needs: secrets_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: warn

  # ============================================================
  # STAGE 3 - SAST (SonarCloud)
  # Requires Java 21 for SonarCloud scanner
  # Detects SQL injection and hardcoded API key
  # ============================================================
  sast:
    name: "SAST (SonarCloud)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (required by SonarCloud)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # STAGE 4 - SCA (Trivy)
  # Cache Maven deps first to avoid rate limiting
  # Blocks on CRITICAL/HIGH vulnerabilities
  # ============================================================
  sca:
    name: "SCA - Dependency Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Populate Maven cache to avoid Trivy rate limiting
        run: mvn -B dependency:resolve -q

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'

      - name: Run Trivy JSON report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'library'

      - name: Upload Trivy SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json

  # ============================================================
  # STAGE 5 - DOCKER BUILD + IMAGE SCAN (Grype)
  # Builds Docker image then scans it for CVEs
  # Blocks on CRITICAL vulnerabilities
  # ============================================================
  docker_scan:
    name: "Docker Build and Image Scan (Grype)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -t devsecops-app:latest .

      - name: Install Grype and scan image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype devsecops-app:latest -o table || echo "Vulnerabilities found - see report"
          grype devsecops-app:latest -o json > grype-image-report.json

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-image-report
          path: grype-image-report.json

  # ============================================================
  # STAGE 6 - IAC SCAN (Checkov)
  # Scans Dockerfile and workflow files
  # Warning only - does not block
  # ============================================================
  iac_scan:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: build_test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true
          output_format: cli

  # ============================================================
  # STAGE 7 - SBOM (Syft)
  # Generates Software Bill of Materials (CycloneDX format)
  # Uploaded as artifact - not blocking
  # ============================================================
  sbom:
    name: "SBOM Generation (Syft)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft and generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft . -o cyclonedx-json > sbom-cyclonedx.json
          syft . -o table

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json

  # ============================================================
  # STAGE 8 - DAST (OWASP ZAP)
  # Starts app with H2 in-memory DB and runs ZAP baseline scan
  # Warning only - does not block
  # ============================================================
  dast:
    name: "DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: build_test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with H2 test dependency
        run: mvn -B package -DskipTests

      - name: Start application with H2 in-memory database
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:h2:mem:testdb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mysql.MysqlDataSourceAutoConfiguration \
            --server.port=8089 \
            --server.servlet.context-path=/student &
          echo "Waiting 45s for app to start..."
          sleep 45

      - name: Check app is running
        run: |
          curl -s http://localhost:8089/student/students/getAllStudents || echo "App endpoint check done"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8089/student'
          cmd_options: '-I'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html

  # ============================================================
  # STAGE 9 - NOTIFY (Telegram)
  # Sends alert on failure or success
  # Always runs regardless of previous stage results
  # ============================================================
  notify:
    name: "Notify (Telegram)"
    runs-on: ubuntu-latest
    needs: [secrets_scan, build_test, sast, sca, docker_scan, iac_scan, sbom, dast]
    if: always()
    steps:
      - name: Send detailed Telegram notification
        run: |
          S1="${{ needs.secrets_scan.result }}"
          S2="${{ needs.build_test.result }}"
          S3="${{ needs.sast.result }}"
          S4="${{ needs.sca.result }}"
          S5="${{ needs.docker_scan.result }}"
          S6="${{ needs.iac_scan.result }}"
          S7="${{ needs.sbom.result }}"
          S8="${{ needs.dast.result }}"
          icon() { [ "$1" = "success" ] && echo "OK" || [ "$1" = "skipped" ] && echo "SKIP" || echo "FAIL"; }
          if echo "$S1 $S2 $S3 $S4 $S5" | grep -q "failure"; then
            STATUS="FAILED"
          else
            STATUS="PASSED"
          fi
          MESSAGE="DevSecOps Pipeline: $STATUS
Repo: BederSaad/DevSecOps
Branch: ${{ github.ref_name }}
Author: ${{ github.actor }}

Stage Results:
[$(icon $S1)] 1-Secrets Scan: $S1
[$(icon $S2)] 2-Build Test:   $S2
[$(icon $S3)] 3-SAST Sonar:   $S3
[$(icon $S4)] 4-SCA Trivy:    $S4
[$(icon $S5)] 5-Docker Grype: $S5
[$(icon $S6)] 6-IaC Checkov:  $S6
[$(icon $S7)] 7-SBOM Syft:    $S7
[$(icon $S8)] 8-DAST ZAP:     $S8

Details: https://github.com/BederSaad/DevSecOps/actions/runs/${{ github.run_id }}"
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE"