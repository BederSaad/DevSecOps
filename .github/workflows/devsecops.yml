name: DevSecOps Pipeline

on:
  push:
    branches: [ main, develop, demo/* ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # STAGE 1 - SECRETS SCAN (Gitleaks)
  # Blocks if any secret/API key/password found in code
  # ============================================================
  secrets_scan:
    name: "Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # ============================================================
  # STAGE 2 - BUILD AND TEST (Maven + Java 17)
  # Blocks if compilation fails or tests fail
  # ============================================================
  build_test:
    name: "Build and Test (Maven)"
    runs-on: ubuntu-latest
    needs: secrets_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: warn

  # ============================================================
  # STAGE 3 - SAST (SonarCloud)
  # Requires Java 21 for SonarCloud scanner
  # Detects SQL injection and hardcoded API key
  # ============================================================
  sast:
    name: "SAST (SonarCloud)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (required by SonarCloud)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # STAGE 4 - SCA (Trivy)
  # Cache Maven deps first to avoid rate limiting
  # Blocks on CRITICAL/HIGH vulnerabilities
  # ============================================================
  sca:
    name: "SCA - Dependency Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Populate Maven cache to avoid Trivy rate limiting
        run: mvn -B dependency:resolve -q

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'

      - name: Run Trivy JSON report
        uses: aquasecurity/trivy-action@0.28.0
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'library'

      - name: Upload Trivy SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json

  # ============================================================
  # STAGE 5 - DOCKER BUILD + IMAGE SCAN (Grype)
  # Builds Docker image then scans it for CVEs
  # Blocks on CRITICAL vulnerabilities
  # ============================================================
  docker_scan:
    name: "Docker Build and Image Scan (Grype)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -t devsecops-app:latest .

      - name: Install Grype and scan image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype devsecops-app:latest -o table || echo "Vulnerabilities found - see report"
          grype devsecops-app:latest -o json > grype-image-report.json

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-image-report
          path: grype-image-report.json

  # ============================================================
  # STAGE 6 - IAC SCAN (Checkov)
  # Scans Dockerfile and workflow files
  # Warning only - does not block
  # ============================================================
  iac_scan:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: build_test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          soft_fail: true
          output_format: cli

  # ============================================================
  # STAGE 7 - SBOM (Syft)
  # Generates Software Bill of Materials (CycloneDX format)
  # Uploaded as artifact - not blocking
  # ============================================================
  sbom:
    name: "SBOM Generation (Syft)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft and generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft . -o cyclonedx-json > sbom-cyclonedx.json
          syft . -o table

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json

  # ============================================================
  # STAGE 8 - DAST (OWASP ZAP)
  # Starts app with H2 in-memory DB and runs ZAP baseline scan
  # Warning only - does not block
  # ============================================================
  dast:
    name: "DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [build_test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build app
        run: mvn -B -DskipTests package

      - name: Start app
        run: |
          nohup java -jar target/*.jar \
            --spring.datasource.url=jdbc:h2:mem:testdb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --server.port=8089 \
            --server.servlet.context-path=/student > app.log 2>&1 &
          echo "Waiting for app to start..."
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8089/student/students/getAllStudents || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ] || [ "$STATUS" = "401" ]; then
              echo "App is up after $((i*3))s (HTTP $STATUS)"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "App failed to start. Log:"
              cat app.log
              exit 1
            fi
            sleep 3
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8089/student'
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'
          fail_action: false

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md

  # ============================================================
  # STAGE 9 - NOTIFY (Telegram)
  # Always runs - sends pipeline summary
  # ============================================================
  notify:
    name: "Notify (Telegram)"
    runs-on: ubuntu-latest
    needs: [secrets_scan, build_test, sast, sca, docker_scan, iac_scan, sbom, dast]
    if: always()
    steps:
      - name: Send detailed Telegram notification
        env:
          S1: ${{ needs.secrets_scan.result }}
          S2: ${{ needs.build_test.result }}
          S3: ${{ needs.sast.result }}
          S4: ${{ needs.sca.result }}
          S5: ${{ needs.docker_scan.result }}
          S6: ${{ needs.iac_scan.result }}
          S7: ${{ needs.sbom.result }}
          S8: ${{ needs.dast.result }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          icon() {
            case "$1" in
              success) echo "OK" ;;
              skipped) echo "SKIP" ;;
              *) echo "FAIL" ;;
            esac
          }
          STATUS="PASSED"
          for s in "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7" "$S8"; do
            [ "$s" = "failure" ] && STATUS="FAILED"
          done
          MESSAGE=$(printf '%s\n' \
            "DevSecOps Pipeline: $STATUS" \
            "Repo: BederSaad/DevSecOps" \
            "Branch: $BRANCH" \
            "Author: $ACTOR" \
            "" \
            "Stage Results:" \
            "[$(icon "$S1")] 1-Secrets Scan: $S1" \
            "[$(icon "$S2")] 2-Build Test: $S2" \
            "[$(icon "$S3")] 3-SAST Sonar: $S3" \
            "[$(icon "$S4")] 4-SCA Trivy: $S4" \
            "[$(icon "$S5")] 5-Docker Grype: $S5" \
            "[$(icon "$S6")] 6-IaC Checkov: $S6" \
            "[$(icon "$S7")] 7-SBOM Syft: $S7" \
            "[$(icon "$S8")] 8-DAST ZAP: $S8" \
            "" \
            "Details: https://github.com/BederSaad/DevSecOps/actions/runs/$RUN_ID")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MESSAGE}"
