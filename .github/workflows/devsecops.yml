name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'demo/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ============================================================
  # STAGE 1 - SECRETS SCAN (Gitleaks)
  # ============================================================
  secrets_scan:
    name: "1 - Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  # ============================================================
  # STAGE 2 - BUILD AND TEST (Maven / Java 17)
  # ============================================================
  build_test:
    name: "2 - Build and Test (Maven)"
    runs-on: ubuntu-latest
    needs: secrets_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Check that an application JAR exists
        shell: bash
        run: |
          set -euo pipefail
          find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*.original' \
            -print -quit | grep -q .

      - name: Upload tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # STAGE 3 - SAST (SonarCloud)
  # ============================================================
  sast:
    name: "3 - SAST (SonarCloud)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: SonarCloud analysis and Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_PROJECT_KEY"
          test -n "$SONAR_ORG"

          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.token="$SONAR_TOKEN"

  # ============================================================
  # STAGE 4 - SCA (Trivy filesystem scan)
  # Blocks on CRITICAL, fixable library vulnerabilities.
  # ============================================================
  sca:
    name: "4 - SCA (Trivy)"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve

      - name: Trivy blocking scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: library
          ignore-unfixed: true

      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-sca-report.json
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: library
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # STAGE 5 - DOCKER BUILD + GRYPE IMAGE SCAN
  # Builds once, scans once, exports the exact image for later jobs.
  # ============================================================
  docker_scan:
    name: "5 - Docker Build and Grype Scan"
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download tested JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --tag devsecops-app:latest \
            .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate Grype JSON report
        if: always()
        run: |
          if docker image inspect devsecops-app:latest >/dev/null 2>&1; then
            grype devsecops-app:latest -o json > grype-image-report.json
          else
            echo "Docker image was not built; no Grype report generated."
            exit 1
          fi

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-image-report
          path: grype-image-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Grype blocking security gate
        run: grype devsecops-app:latest -o table --fail-on critical --only-fixed

      - name: Export the scanned image
        run: docker save devsecops-app:latest -o devsecops-app.tar

      - name: Upload the scanned image
        uses: actions/upload-artifact@v4
        with:
          name: scanned-docker-image
          path: devsecops-app.tar
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # STAGE 6 - IaC SCAN (Checkov)
  # Blocking: Checkov findings fail this job.
  # ============================================================
  iac_scan:
    name: "6 - IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: docker_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dockerfile and IaC
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          soft_fail: false
          output_format: cli

  # ============================================================
  # STAGE 7 - SBOM (Syft)
  # Generates the SBOM from the exact Docker image that was scanned.
  # ============================================================
  sbom:
    name: "7 - SBOM (Syft)"
    runs-on: ubuntu-latest
    needs: iac_scan
    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: scanned-docker-image
          path: .

      - name: Load scanned Docker image
        run: docker load --input devsecops-app.tar

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate image SBOM
        run: |
          syft devsecops-app:latest -o cyclonedx-json > sbom-cyclonedx.json
          syft devsecops-app:latest -o table

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # STAGE 8 - DAST (OWASP ZAP)
  # Reuses the JAR produced and tested in Stage 2.
  # ============================================================
  dast:
    name: "8 - DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download tested JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Locate application JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*.original' \
            -print -quit)"
          if [ -z "$JAR_PATH" ]; then
            echo "No executable JAR found in target/"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Start application
        env:
          APP_JAR: ${{ steps.jar.outputs.path }}
        run: |
          set -euo pipefail
          nohup java -jar "$APP_JAR" \
            --spring.datasource.url=jdbc:h2:mem:testdb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --server.port=8089 \
            --server.servlet.context-path=/student \
            > app.log 2>&1 &

          for i in $(seq 1 40); do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:8089/student/students/getAllStudents || true)"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || [ "$STATUS" = "404" ]; then
              echo "Application started (HTTP $STATUS)."
              exit 0
            fi
            sleep 3
          done

          echo "Application did not start. Application logs:"
          cat app.log
          exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8089/student
          allow_issue_writing: false
          rules_file_name: .zap/rules.tsv
          fail_action: true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload application startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-application-log
          path: app.log
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # STAGE 9 - DEPLOY (GHCR + Cosign keyless)
  # Only runs on a push to main after every security gate succeeds.
  # Publishes the exact image scanned in Stage 5.
  # ============================================================
  deploy:
    name: "9 - Deploy (GHCR + Cosign)"
    runs-on: ubuntu-latest
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/bedersaad/devsecops
    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: scanned-docker-image
          path: .

      - name: Load scanned Docker image
        run: docker load --input devsecops-app.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        id: push
        shell: bash
        run: |
          set -euo pipefail

          docker tag devsecops-app:latest "$IMAGE:$GITHUB_SHA"
          docker tag devsecops-app:latest "$IMAGE:latest"

          docker push "$IMAGE:$GITHUB_SHA" 2>&1 | tee push.log

          DIGEST="$(grep -oE 'digest: sha256:[a-f0-9]+' push.log | tail -n 1 | sed 's/^digest: //')"
          if [ -z "$DIGEST" ]; then
            echo "Could not extract the pushed image digest."
            cat push.log
            exit 1
          fi

          docker push "$IMAGE:latest"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published image: $IMAGE@$DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest with keyless Cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify image signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/devsecops.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

  # ============================================================
  # STAGE 10 - NOTIFY (Telegram)
  # Always runs after the pipeline jobs have finished.
  # ============================================================
  notify:
    name: "10 - Notify (Telegram)"
    runs-on: ubuntu-latest
    needs:
      - secrets_scan
      - build_test
      - sast
      - sca
      - docker_scan
      - iac_scan
      - sbom
      - dast
      - deploy
    if: always()
    steps:
      - name: Send final Telegram notification
        env:
          S1: ${{ needs.secrets_scan.result }}
          S2: ${{ needs.build_test.result }}
          S3: ${{ needs.sast.result }}
          S4: ${{ needs.sca.result }}
          S5: ${{ needs.docker_scan.result }}
          S6: ${{ needs.iac_scan.result }}
          S7: ${{ needs.sbom.result }}
          S8: ${{ needs.dast.result }}
          S9: ${{ needs.deploy.result }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          icon() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️" ;;
              failure|cancelled) echo "❌" ;;
              *) echo "⚪" ;;
            esac
          }

          STATUS="✅ PIPELINE RÉUSSI"
          for s in "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7" "$S8" "$S9"; do
            if [ "$s" = "failure" ] || [ "$s" = "cancelled" ]; then
              STATUS="🚨 PIPELINE EN ÉCHEC"
            fi
          done

          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets are missing: TELEGRAM_TOKEN and/or TELEGRAM_CHAT_ID."
            exit 1
          fi

          MESSAGE="$(printf '%s\n' \
            "$STATUS" \
            "Repository: $REPOSITORY" \
            "Branch: $BRANCH" \
            "Actor: $ACTOR" \
            "" \
            "Pipeline stages:" \
            "$(icon "$S1") 1 - Secrets Scan (Gitleaks): $S1" \
            "$(icon "$S2") 2 - Build and Test (Maven): $S2" \
            "$(icon "$S3") 3 - SAST (SonarCloud): $S3" \
            "$(icon "$S4") 4 - SCA (Trivy): $S4" \
            "$(icon "$S5") 5 - Docker Build and Grype: $S5" \
            "$(icon "$S6") 6 - IaC (Checkov): $S6" \
            "$(icon "$S7") 7 - SBOM (Syft): $S7" \
            "$(icon "$S8") 8 - DAST (OWASP ZAP): $S8" \
            "$(icon "$S9") 9 - Deploy (GHCR + Cosign): $S9" \
            "" \
            "Details: https://github.com/$REPOSITORY/actions/runs/$RUN_ID")"

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MESSAGE}" \
            -o telegram-response.json

          jq -e '.ok == true' telegram-response.json >/dev/null
          echo "Telegram notification sent successfully."
