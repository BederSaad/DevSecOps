name: DevSecOps Pipeline

on:
  push:
    branches: [ main, develop, demo/* ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # STAGE 1 - SECRETS SCAN (Gitleaks)
  # Blocks if any secret/API key/password found in code
  # ============================================================
  secrets_scan:
    name: "Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # STAGE 2 - BUILD AND TEST (Maven + Java 17)
  # Blocks if compilation fails or tests fail
  # Local: Java 23 / Pipeline: Java 17 (pom.xml target)
  # ============================================================
  build_test:
    name: "Build and Test (Maven)"
    runs-on: ubuntu-latest
    needs: secrets_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: warn

  # ============================================================
  # STAGE 3 - SAST (SonarCloud)
  # Blocks if quality gate fails
  # Detects SQL injection and hardcoded API key
  # ============================================================
  sast:
    name: "SAST (SonarCloud)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify sonar:sonar \
            -DskipTests \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # STAGE 4 - SCA (Trivy)
  # Scans pom.xml dependencies for known CVEs
  # Blocks on CRITICAL/HIGH vulnerabilities
  # ============================================================
  sca:
    name: "SCA - Dependency Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'library'

      - name: Run Trivy JSON report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-sca-report.json'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'library'

      - name: Upload Trivy SCA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json

  # ============================================================
  # STAGE 5 - DOCKER BUILD + IMAGE SCAN (Grype)
  # Builds Docker image then scans it for CVEs
  # Blocks on CRITICAL vulnerabilities
  # ============================================================
  docker_scan:
    name: "Docker Build and Image Scan (Grype)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build Docker image
        run: docker build -t devsecops-app:latest .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image with Grype (blocking on CRITICAL)
        run: |
          grype devsecops-app:latest --fail-on critical -o table

      - name: Grype JSON report
        if: always()
        run: |
          grype devsecops-app:latest -o json > grype-image-report.json

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-image-report
          path: grype-image-report.json

  # ============================================================
  # STAGE 6 - IAC SCAN (Checkov) - Optional
  # Scans Dockerfile and workflow files
  # Warning only - does not block the pipeline
  # ============================================================
  iac_scan:
    name: "IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: build_test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile
          soft_fail: true
          output_format: cli

  # ============================================================
  # STAGE 7 - SBOM (Syft) - Optional
  # Generates Software Bill of Materials (CycloneDX format)
  # Uploaded as artifact - not blocking
  # ============================================================
  sbom:
    name: "SBOM Generation (Syft)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM in CycloneDX format
        run: |
          syft . -o cyclonedx-json > sbom-cyclonedx.json

      - name: Show SBOM summary
        run: syft . -o table

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json

  # ============================================================
  # STAGE 8 - DAST (OWASP ZAP)
  # Starts app with H2 in-memory DB and runs ZAP baseline scan
  # Warning only - does not block
  # ============================================================
  dast:
    name: "DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: build_test
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Start application with H2 in-memory database
        run: |
          java -jar target/*.jar \
            --spring.datasource.url=jdbc:h2:mem:testdb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.jpa.database-platform=org.hibernate.dialect.H2Dialect \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --server.port=8089 \
            --server.servlet.context-path=/student &
          echo "Waiting for app to start..."
          sleep 40

      - name: Check app is running
        run: curl -f http://localhost:8089/student/students/getAllStudents || echo "App may not be fully ready"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8089/student'
          cmd_options: '-I'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html

  # ============================================================
  # STAGE 9 - NOTIFY (Telegram)
  # Sends alert on failure or success
  # Always runs regardless of previous stage results
  # ============================================================
  notify:
    name: "Notify (Telegram)"
    runs-on: ubuntu-latest
    needs: [secrets_scan, build_test, sast, sca, docker_scan, iac_scan, sbom, dast]
    if: always()
    steps:
      - name: Send Telegram notification
        run: |
          FAILED_JOBS=""
          if [ "${{ needs.secrets_scan.result }}" = "failure" ]; then FAILED_JOBS="$FAILED_JOBS secrets_scan"; fi
          if [ "${{ needs.build_test.result }}" = "failure" ]; then FAILED_JOBS="$FAILED_JOBS build_test"; fi
          if [ "${{ needs.sast.result }}" = "failure" ]; then FAILED_JOBS="$FAILED_JOBS sast"; fi
          if [ "${{ needs.sca.result }}" = "failure" ]; then FAILED_JOBS="$FAILED_JOBS sca"; fi
          if [ "${{ needs.docker_scan.result }}" = "failure" ]; then FAILED_JOBS="$FAILED_JOBS docker_scan"; fi

          if [ -n "$FAILED_JOBS" ]; then
            MESSAGE="❌ DevSecOps Pipeline FAILED
Repo: BederSaad/DevSecOps
Branch: ${{ github.ref_name }}
Commit: ${{ github.sha }}
Author: ${{ github.actor }}
Failed stages:$FAILED_JOBS
Details: https://github.com/BederSaad/DevSecOps/actions/runs/${{ github.run_id }}"
          else
            MESSAGE="✅ DevSecOps Pipeline PASSED
Repo: BederSaad/DevSecOps
Branch: ${{ github.ref_name }}
Commit: ${{ github.sha }}
Author: ${{ github.actor }}
All security checks passed"
          fi

          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="$MESSAGE"