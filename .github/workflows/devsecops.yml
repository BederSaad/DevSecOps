name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop, 'demo/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ============================================================
  # STAGE 1 - SECRETS SCAN (Gitleaks)
  # ============================================================
  secrets_scan:
    name: "1 - Secrets Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false


  # ============================================================
  # STAGE 2 - BUILD AND TEST
  # FIX : Java 21 — requis par Spring Boot 4 / Spring 7
  # ============================================================
  # STAGE 2 - BUILD AND TEST
  build_test:
    name: "2 - Build and Test (Maven)"
    runs-on: ubuntu-latest
    needs: secrets_scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21        # ← était 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - run: java -version
      - run: mvn -B clean verify

      - name: Verify executable JAR
        run: |
          JAR=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.jar.original' | head -n 1)
          [ -n "$JAR" ] || { echo "No JAR found."; exit 1; }
          echo "JAR: $JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # STAGE 3 - SAST (SonarCloud)
  # Java 21 requis par le scanner ET par Spring Boot 4
  # ============================================================
  sast:
    name: "3 - SAST (SonarCloud)"
    runs-on: ubuntu-latest
    needs: build_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Check SonarCloud secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          test -n "$SONAR_TOKEN"       || { echo "SONAR_TOKEN is missing.";       exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY is missing."; exit 1; }
          test -n "$SONAR_ORG"         || { echo "SONAR_ORG is missing.";         exit 1; }

      - name: SonarCloud Scan and Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORG" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true


  # ============================================================
  # STAGE 4 - SCA (Trivy)
  # FIX : ignore-unfixed=false pour détecter les CVE fixables
  # ============================================================
  sca:
    name: "4 - SCA (Trivy)"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21        # ← était 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - run: mvn -B dependency:resolve -q

      - name: Trivy filesystem scan - blocking
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL
          vuln-type: library
          ignore-unfixed: true

      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-sca-report.json
          severity: CRITICAL,HIGH,MEDIUM
          vuln-type: library
          ignore-unfixed: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca-report.json
          if-no-files-found: warn
  # ============================================================
  # STAGE 5 - DOCKER BUILD + GRYPE
  # FIX : Dockerfile utilise Java 21 + image visible Docker Desktop
  # ============================================================
  docker_scan:
    name: "5 - Docker Build and Grype Scan"
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download tested JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Verify downloaded JAR
        run: |
          JAR=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.jar.original' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "Tested JAR is missing."
            exit 1
          fi
          echo "JAR found: $JAR"

      - name: Build Docker image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/BederSaad/DevSecOps \
            --label org.opencontainers.image.description="Student Management - DevSecOps pipeline" \
            --label org.opencontainers.image.version="${{ github.sha }}" \
            -t devsecops-app:ci \
            -t devsecops-app:latest .

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
          grype version

      - name: Generate Grype JSON report
        if: always()
        run: |
          if docker image inspect devsecops-app:ci >/dev/null 2>&1; then
            grype devsecops-app:ci -o json > grype-image-report.json
          else
            echo "Docker image is unavailable." > grype-image-report.json
          fi

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-image-report
          path: grype-image-report.json
          if-no-files-found: warn

      - name: Grype vulnerability gate
        run: |
          grype devsecops-app:ci \
            -o table \
            --fail-on critical \
            --only-fixed

      - name: Save scanned Docker image as tar
        run: docker save devsecops-app:ci -o devsecops-image.tar

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v4
        with:
          name: scanned-docker-image
          path: devsecops-image.tar
          if-no-files-found: error
          retention-days: 1


  # ============================================================
  # STAGE 6 - IaC SCAN (Checkov)
  # ============================================================
  iac_scan:
    name: "6 - IaC Scan (Checkov)"
    runs-on: ubuntu-latest
    needs: docker_scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          file: Dockerfile
          framework: dockerfile
          soft_fail: false
          output_format: cli


  # ============================================================
  # STAGE 7 - SBOM (Syft)
  # ============================================================
  sbom:
    name: "7 - SBOM Generation (Syft)"
    runs-on: ubuntu-latest
    needs: iac_scan
    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: scanned-docker-image
          path: .

      - name: Load scanned Docker image
        run: docker load -i devsecops-image.tar

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate CycloneDX SBOM
        run: |
          syft devsecops-app:ci -o cyclonedx-json > sbom-cyclonedx.json
          syft devsecops-app:ci -o table

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
          if-no-files-found: error


  # ============================================================
  # STAGE 8 - DAST (OWASP ZAP)
  # FIX : Java 21 pour lancer le JAR Spring Boot 4
  # ============================================================
  dast:
    name: "8 - DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21        # ← était 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Verify application JAR
        run: |
          JAR=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.jar.original' | head -n 1)
          [ -n "$JAR" ] || { echo "JAR not found."; exit 1; }
          echo "APP_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Start Spring Boot application
        run: |
          nohup java -jar "$APP_JAR" \
            --spring.datasource.url=jdbc:h2:mem:testdb \
            --spring.datasource.driver-class-name=org.h2.Driver \
            --spring.datasource.username=sa \
            --spring.datasource.password= \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --server.port=8089 \
            --server.servlet.context-path=/student \
            > app.log 2>&1 &

          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:8089/student/students/getAllStudents || true)
            [ "$STATUS" = "200" ] && { echo "App started."; break; }
            [ "$i" -eq 40 ] && { echo "App failed to start."; cat app.log; exit 1; }
            sleep 3
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8089/student/students/getAllStudents'
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'
          fail_action: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
            app.log
          if-no-files-found: warn

  # ============================================================
  # STAGE 9 - DEPLOY (GHCR + COSIGN)
  # FIX : push image visible dans Docker Desktop via docker pull
  # ============================================================
  deploy:
    name: "9 - Deploy (GHCR + Cosign)"
    runs-on: ubuntu-latest
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE: ghcr.io/bedersaad/devsecops

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: scanned-docker-image
          path: .

      - name: Load scanned image
        run: docker load -i devsecops-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          docker tag devsecops-app:ci "$IMAGE:$SHA_TAG"
          docker tag devsecops-app:ci "$IMAGE:latest"

      - name: Push image with commit SHA tag
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          set -o pipefail
          docker push "$IMAGE:$SHA_TAG" 2>&1 | tee push.log

          DIGEST=$(grep -oE 'sha256:[a-f0-9]{64}' push.log | tail -n 1)
          if [ -z "$DIGEST" ]; then
            echo "Could not extract image digest."
            exit 1
          fi
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Published digest: $DIGEST"

      - name: Push latest tag
        run: docker push "$IMAGE:latest"

      # FIX : rendre le package public pour docker pull sans auth
      - name: Set GHCR package visibility to public
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/BederSaad/packages/container/devsecops" \
            -d '{"visibility":"public"}' | jq .

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image using GitHub OIDC
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"

      - name: Verify image signature
        run: |
          cosign verify "$IMAGE@$IMAGE_DIGEST" \
            --certificate-identity-regexp \
              "^https://github.com/BederSaad/DevSecOps/.github/workflows/devsecops.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # FIX : vérification finale — image pullable publiquement
      - name: Confirm image is publicly pullable
        run: |
          docker pull "$IMAGE:latest"
          echo "Image successfully pulled: $IMAGE:latest"
          docker image inspect "$IMAGE:latest" | jq '.[0].RepoTags'


  # ============================================================
  # STAGE 10 - DOCKER COMPOSE DEPLOYMENT (Self-Hosted Runner)
  # Deploys via Docker Compose on the local machine.
  # The self-hosted runner runs on the same host as Docker Desktop.
  # Cloudflare Tunnel provides public HTTPS — no ports exposed.
  # ============================================================
  compose_deploy:
    name: "10 - Docker Compose Deploy"
    runs-on: [self-hosted, linux, compose-deploy]
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    env:
      IMAGE: ghcr.io/bedersaad/devsecops

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 1. Verify image signature BEFORE deploying ──────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature (SHA tag)
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          cosign verify "$IMAGE:$SHA_TAG" \
            --certificate-identity-regexp \
              "^https://github.com/BederSaad/DevSecOps/.github/workflows/devsecops.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "✅ Image signature verified for $IMAGE:$SHA_TAG"

      # ── 2. Write .env from GitHub Secrets (never committed to git) ──
      - name: Write deployment .env file
        env:
          MYSQL_ROOT_PASSWORD:     ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_USERNAME:          ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD:          ${{ secrets.MYSQL_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SHA_TAG:                 ${{ github.sha }}
          PUBLIC_DOMAIN:           ${{ secrets.PUBLIC_DOMAIN }}
        run: |
          printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_DATABASE=studentdb\nMYSQL_USERNAME=%s\nMYSQL_PASSWORD=%s\nIMAGE_TAG=%s\nCLOUDFLARE_TUNNEL_TOKEN=%s\nPUBLIC_DOMAIN=%s\n' \
            "$MYSQL_ROOT_PASSWORD" \
            "$MYSQL_USERNAME" \
            "$MYSQL_PASSWORD" \
            "$SHA_TAG" \
            "$CLOUDFLARE_TUNNEL_TOKEN" \
            "$PUBLIC_DOMAIN" \
            > .env
          echo "✅ .env written (secrets not logged)"

      # ── 3. Pull the signed image ────────────────────────────────────
      - name: Pull signed image
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          docker pull "$IMAGE:$SHA_TAG"
          docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
          echo "✅ Image pulled and tagged as latest"

      # ── 4. Deploy with Docker Compose (rolling update) ─────────────
      - name: Deploy with Docker Compose
        run: |
          # Bring up MySQL first (if not running), then update app
          docker compose pull app
          docker compose up -d --no-deps app cloudflared
          echo "✅ Containers updated"

      # ── 5. Wait for healthy status ──────────────────────────────────
      - name: Wait for application health
        run: |
          echo "Waiting for student-app to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' student-app 2>/dev/null || echo "missing")
            echo "  Attempt $i/30 — status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✅ Application is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Timeout waiting for healthy status"
              docker compose logs app --tail=50
              exit 1
            fi
            sleep 10
          done

      # ── 6. Functional health check ──────────────────────────────────
      - name: Application API health check
        run: |
          # App port is not published externally — check via docker exec
          HTTP_CODE=$(docker exec student-app wget -qS \
            http://localhost:8089/student/students/getAllStudents 2>&1 \
            | grep "HTTP/" | awk '{print $2}' | head -1 || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ API responded HTTP 200"
          else
            echo "⚠️  API returned HTTP $HTTP_CODE (may be first-time startup)"
            docker compose logs app --tail=30
          fi

      # ── 7. Print Cloudflare public URL ──────────────────────────────
      - name: Print Cloudflare tunnel URL
        run: |
          echo "Fetching Cloudflare quick-tunnel public URL..."
          sleep 5
          docker logs student-cloudflared 2>&1 | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | tail -1 || \
            echo "URL not yet available — check: docker logs student-cloudflared"

      # ── 8. Print summary ────────────────────────────────────────────
      - name: Deployment summary
        env:
          SHA_TAG: ${{ github.sha }}
        run: |
          echo "========================================"
          echo "DEPLOYMENT SUMMARY"
          echo "========================================"
          echo "Image: $IMAGE:$SHA_TAG"
          docker compose ps
          echo "========================================"

      # ── 9. Cleanup .env ─────────────────────────────────────────────
      - name: Remove .env from runner workspace
        if: always()
        run: rm -f .env


  # ============================================================
  # STAGE 11 - NOTIFICATION (Telegram)
  # ============================================================
  notify:
    name: "11 - Notification (Telegram)"
    runs-on: ubuntu-latest
    needs:
      - secrets_scan
      - build_test
      - sast
      - sca
      - docker_scan
      - iac_scan
      - sbom
      - dast
      - deploy
      - compose_deploy
    if: always()
    steps:
      - name: Send Telegram notification
        env:
          S1:  ${{ needs.secrets_scan.result }}
          S2:  ${{ needs.build_test.result }}
          S3:  ${{ needs.sast.result }}
          S4:  ${{ needs.sca.result }}
          S5:  ${{ needs.docker_scan.result }}
          S6:  ${{ needs.iac_scan.result }}
          S7:  ${{ needs.sbom.result }}
          S8:  ${{ needs.dast.result }}
          S9:  ${{ needs.deploy.result }}
          S10: ${{ needs.compose_deploy.result }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
          BRANCH:   ${{ github.ref_name }}
          ACTOR:    ${{ github.actor }}
          RUN_ID:   ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets are missing."
            exit 1
          fi

          icon() {
            case "$1" in
              success)   echo "✅" ;;
              skipped)   echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)         echo "❌" ;;
            esac
          }

          STATUS="✅ PIPELINE VERT"
          for s in "$S1" "$S2" "$S3" "$S4" "$S5" "$S6" "$S7" "$S8" "$S9" "$S10"; do
            if [ "$s" = "failure" ] || [ "$s" = "cancelled" ]; then
              STATUS="🚨 PIPELINE BLOQUÉ"
            fi
          done

          MESSAGE=$(printf '%s\n' \
            "$STATUS" \
            "Repository: BederSaad/DevSecOps" \
            "Branch: $BRANCH" \
            "Actor: $ACTOR" \
            "" \
            "Stage results:" \
            "$(icon "$S1")  1 - Gitleaks: $S1" \
            "$(icon "$S2")  2 - Build and Test: $S2" \
            "$(icon "$S3")  3 - SonarCloud SAST: $S3" \
            "$(icon "$S4")  4 - Trivy SCA: $S4" \
            "$(icon "$S5")  5 - Docker and Grype: $S5" \
            "$(icon "$S6")  6 - Checkov: $S6" \
            "$(icon "$S7")  7 - Syft SBOM: $S7" \
            "$(icon "$S8")  8 - OWASP ZAP: $S8" \
            "$(icon "$S9")  9 - GHCR + Cosign: $S9" \
            "$(icon "$S10") 10 - Compose Deploy: $S10" \
            "" \
            "Details: https://github.com/BederSaad/DevSecOps/actions/runs/$RUN_ID")

          RESPONSE=$(curl --fail-with-body -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MESSAGE}")

          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null