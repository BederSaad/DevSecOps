# ==============================================================================
# Docker Compose — Student Management Full Stack (Frontend + Backend + Cloudflare)
#
# Architecture:
#   Internet → Cloudflare HTTPS → cloudflared tunnel → frontend (Nginx :80)
#                                                       ├── / (React SPA)
#                                                       └── /student/ (proxy to backend app:8089)
# ==============================================================================

services:

  # ── Spring Boot Backend Application ──────────────────────────────────────────
  app:
    image: ghcr.io/bedersaad/devsecops:${IMAGE_TAG:-latest}
    container_name: student-app
    restart: unless-stopped
    user: "root"

    environment:
      # Persistent Database storage configuration
      SPRING_DATASOURCE_URL:                   jdbc:h2:file:/data/studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_DRIVER_CLASS_NAME:     org.h2.Driver
      DB_USERNAME:                             ${DB_USERNAME:-sa}
      DB_PASSWORD:                             ${DB_PASSWORD:-}
      SPRING_JPA_DATABASE_PLATFORM:            org.hibernate.dialect.H2Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO:           update
      SPRING_JPA_SHOW_SQL:                     "false"
      # Server
      SERVER_PORT:                             8089
      SERVER_SERVLET_CONTEXT_PATH:             /student
      # CORS
      APP_CORS_ALLOWED_ORIGINS:                "*"
      # JVM memory tuning
      JAVA_TOOL_OPTIONS:                       "-Xms256m -Xmx512m -XX:+UseContainerSupport"

    volumes:
      - student_db_data:/data

    expose:
      - "8089"

    networks:
      - student_net

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/student/students/getAllStudents || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── React Frontend + Nginx Reverse Proxy ────────────────────────────────────
  frontend:
    image: student-frontend:latest
    container_name: student-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

    expose:
      - "80"

    networks:
      - student_net

  # ── Cloudflare Tunnel — public HTTPS without port forwarding ────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: student-cloudflared
    restart: unless-stopped

    # Route incoming traffic directly to frontend Nginx reverse proxy
    command: tunnel --no-autoupdate --url http://frontend:80

    depends_on:
      - frontend

    networks:
      - student_net

volumes:
  student_db_data:
    name: student_db_data

networks:
  student_net:
    name: student_network
    driver: bridge
