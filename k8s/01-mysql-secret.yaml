# ──────────────────────────────────────────────────────────────────────────────
# MySQL Secrets — values are base64-encoded placeholders.
# DO NOT commit real credentials here.
# Real values are injected at deploy-time by GitHub Actions from GitHub Secrets.
# kubectl create secret generic mysql-secret \
#   --from-literal=mysql-root-password='<real_root_pw>' \
#   --from-literal=mysql-database='studentdb' \
#   --from-literal=mysql-username='studentapp' \
#   --from-literal=mysql-password='<real_app_pw>' \
#   -n student-management --dry-run=client -o yaml | kubectl apply -f -
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: student-management
  labels:
    app: mysql
    app.kubernetes.io/component: database
type: Opaque
# PLACEHOLDER values — overwritten by CI/CD via kubectl apply with real values
# These are base64 of "changeme" / "studentdb" / "studentapp" / "changeme"
data:
  mysql-root-password: Y2hhbmdlbWU=
  mysql-database: c3R1ZGVudGRi
  mysql-username: c3R1ZGVudGFwcA==
  mysql-password: Y2hhbmdlbWU=
