apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: student-management
  labels:
    app: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "8.0"
spec:
  serviceName: mysql-headless
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/component: database
    spec:
      # Security context at pod level
      securityContext:
        runAsUser: 999        # mysql user in official image
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true

      terminationGracePeriodSeconds: 60

      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3306
              name: mysql
              protocol: TCP

          # Security context at container level
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # MySQL needs write access to /var/lib/mysql
            capabilities:
              drop:
                - ALL

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-config-vol
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
            - name: tmp-dir
              mountPath: /tmp

          # Liveness probe — MySQL alive?
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - --password=$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe — MySQL accepting connections?
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
                - -u
                - root
                - --password=$(MYSQL_ROOT_PASSWORD)
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-config-vol
          configMap:
            name: mysql-config
            items:
              - key: my.cnf
                path: my.cnf
        - name: tmp-dir
          emptyDir: {}
